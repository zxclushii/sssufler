[package]
name = "suflyor"
version = "2.0.0"
edition = "2021"
rust-version = "1.100"
publish = false
description = "Локальное распознавание речи и терминал Claude Code для Windows"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
anyhow = "=1.0.104"
reqwest = { version = "=0.13.5", features = ["multipart", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
tracing = "=0.1.44"

[target.'cfg(windows)'.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
cpal = "=0.18.2"
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
tracing-subscriber = "=0.3.23"

[profile.release]
strip = true
